<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业 RAG 知识库</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #1a1a2e; }
header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
header h1 { font-size: 20px; font-weight: 600; }
header span { font-size: 12px; opacity: .8; }
.layout { display: grid; grid-template-columns: 340px 1fr; height: calc(100vh - 52px); }
/* 左侧 */
.sidebar { background: #fff; border-right: 1px solid #e8ecf1; display: flex; flex-direction: column; overflow: hidden; }
.sidebar-section { padding: 16px; border-bottom: 1px solid #e8ecf1; }
.sidebar-section h3 { font-size: 13px; color: #6b7280; margin-bottom: 10px; text-transform: uppercase; letter-spacing: .5px; }
.btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all .2s; display: inline-flex; align-items: center; gap: 6px; }
.btn-primary { background: #667eea; color: #fff; width: 100%; justify-content: center; }
.btn-primary:hover { background: #5a6fd6; }
.btn-secondary { background: #f0f2f5; color: #374151; }
.btn-secondary:hover { background: #e2e6ea; }
.btn-danger { background: #fee2e2; color: #dc2626; }
.btn-danger:hover { background: #fecaca; }
.file-zone { border: 2px dashed #d1d5db; border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; transition: all .2s; margin-top: 8px; }
.file-zone:hover { border-color: #667eea; background: #f8f9ff; }
.file-zone.dragover { border-color: #667eea; background: #eef0ff; }
.file-zone input { display: none; }
.file-zone p { font-size: 13px; color: #9ca3af; }
.form-row { display: flex; gap: 8px; margin-top: 8px; }
.form-row select, .form-row input { flex: 1; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; outline: none; }
.form-row select:focus, .form-row input:focus { border-color: #667eea; }
.upload-status { font-size: 12px; margin-top: 6px; color: #6b7280; }
.doc-list { flex: 1; overflow-y: auto; padding: 0 16px 16px; }
.doc-list .empty { color: #9ca3af; font-size: 13px; text-align: center; padding: 24px 0; }
/* 右侧 */
.main { display: flex; flex-direction: column; background: #fff; }
.chat-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.msg { max-width: 85%; padding: 12px 16px; border-radius: 10px; font-size: 14px; line-height: 1.6; animation: fadeIn .3s; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.msg.user { align-self: flex-end; background: #667eea; color: #fff; }
.msg.assistant { align-self: flex-start; background: #f3f4f6; }
.msg.assistant .sources { margin-top: 8px; font-size: 11px; color: #9ca3af; }
.msg.assistant .sources span { background: #e5e7eb; padding: 1px 6px; border-radius: 4px; margin-right: 4px; }
.input-area { border-top: 1px solid #e8ecf1; padding: 16px; display: flex; gap: 8px; }
.input-area input { flex: 1; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; outline: none; }
.input-area input:focus { border-color: #667eea; }
.input-area button { padding: 10px 20px; background: #667eea; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
.input-area button:hover { background: #5a6fd6; }
.input-area button:disabled { opacity: .5; cursor: not-allowed; }
.welcome { text-align: center; color: #9ca3af; padding: 60px 20px; }
.welcome h2 { font-size: 24px; margin-bottom: 8px; color: #374151; }
.status-bar { padding: 8px 16px; background: #f0f2f5; font-size: 12px; color: #6b7280; display: flex; justify-content: space-between; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.status-dot.ok { background: #10b981; }
.progress { height: 4px; background: #e5e7eb; border-radius: 2px; margin-top: 8px; overflow: hidden; display: none; }
.progress.active { display: block; }
.progress-bar { height: 100%; background: #667eea; border-radius: 2px; transition: width .4s; }
</style>
</head>
<body>

<header>
  <h1>📚 企业 RAG 知识库</h1>
  <span>Milvus + DashScope</span>
</header>

<div class="layout">
  <!-- 左侧：文档管理 -->
  <aside class="sidebar">
    <div class="sidebar-section">
      <h3>📄 上传文档</h3>
      <div class="file-zone" id="dropZone">
        <input type="file" id="fileInput" accept=".txt,.md,.pdf,.docx,.csv,.xlsx,.json,.yml,.yaml">
        <p>拖拽文件到此处或点击上传</p>
        <p style="font-size:11px;margin-top:4px">支持 TXT / MD / PDF / DOCX / XLSX / CSV</p>
      </div>
      <div class="form-row">
        <select id="docType">
          <option value="sop">SOP</option>
          <option value="spec">技术规范</option>
          <option value="contract">合同</option>
          <option value="faq">FAQ</option>
          <option value="report">报告</option>
        </select>
        <input type="text" id="deptInput" placeholder="部门（可选）">
      </div>
      <button class="btn btn-primary" id="uploadBtn" style="margin-top:8px">⬆ 上传入库</button>
      <div class="upload-status" id="uploadStatus"></div>
      <div class="progress" id="uploadProgress"><div class="progress-bar" style="width:0%"></div></div>
    </div>

    <div class="sidebar-section">
      <h3>💬 会话</h3>
      <button class="btn btn-primary" onclick="newConversation()" style="margin-bottom:8px">＋ 新会话</button>
      <div id="convList" style="max-height:200px;overflow-y:auto;font-size:13px">
        <div class="empty">暂无会话</div>
      </div>
    </div>

    <div class="doc-list" id="docList">
      <div class="empty">暂无文档，请上传</div>
    </div>

    <div class="sidebar-section">
      <h3>📊 RAG 评估</h3>
      <button class="btn btn-primary" onclick="genDataset()" style="margin-bottom:6px">🤖 生成评估数据</button>
      <button class="btn btn-secondary" onclick="evalRetrieval()" style="margin-bottom:4px;width:100%">📈 检索质量</button>
      <button class="btn btn-secondary" onclick="evalGeneration()" style="margin-bottom:4px;width:100%">✅ 生成质量</button>
      <button class="btn btn-secondary" onclick="evalFull()" style="width:100%">🔬 完整评估</button>
      <div class="upload-status" id="evalStatus"></div>
    </div>
  </aside>

  <!-- 右侧：对话 -->
  <main class="main">
    <div class="status-bar">
      <span><span class="status-dot ok" id="statusDot"></span> <span id="statusText">就绪</span></span>
      <span id="cacheInfo"></span>
    </div>
    <div class="chat-area" id="chatArea">
      <div class="welcome">
        <h2>👋 欢迎使用企业知识库</h2>
        <p>在左侧上传文档后开始提问</p>
      </div>
    </div>
    <div class="input-area">
      <input type="text" id="queryInput" placeholder="输入问题..." autofocus>
      <button id="sendBtn">发送</button>
    </div>
  </main>
</div>

<script>
const API = '/api';
let history = [];
let currentConvId = null;

// ── 会话管理 ──
async function newConversation() {
  try {
    const r = await fetch(`${API}/conversations?title=新会话`, { method: 'POST' });
    const d = await r.json();
    currentConvId = d.id;
    history = [];
    chatArea.innerHTML = '<div class="welcome"><h2>👋 新会话</h2><p>开始提问吧</p></div>';
    loadConversations();
  } catch(e) { console.error('创建会话失败', e); }
}

async function loadConversations() {
  try {
    const r = await fetch(`${API}/conversations`);
    const d = await r.json();
    const el = document.getElementById('convList');
    if (!d.conversations.length) {
      el.innerHTML = '<div class="empty">暂无会话</div>';
      return;
    }
    el.innerHTML = d.conversations.map(c => `
      <div style="padding:6px 0;border-bottom:1px solid #f0f0f0;cursor:pointer;${c.id===currentConvId?'background:#eef0ff;':''}"
           onclick="switchConversation('${c.id}')">
        <div style="font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.title||'新会话'}</div>
        <div style="font-size:11px;color:#9ca3af">${new Date(c.created_at).toLocaleString()}</div>
      </div>
    `).join('');
  } catch(e) {}
}

async function switchConversation(convId) {
  currentConvId = convId;
  try {
    const r = await fetch(`${API}/conversations/${convId}`);
    const d = await r.json();
    chatArea.innerHTML = '';
    if (d.messages) {
      d.messages.forEach(m => addMsg(m.role, m.content, m.sources));
    }
    history = (d.messages||[]).map(m => ({role:m.role,content:m.content}));
    loadConversations();
    chatArea.scrollTop = chatArea.scrollHeight;
  } catch(e) {}
}

// 页面加载时获取会话列表
loadConversations();

// ── 文件上传 ──
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const uploadBtn = document.getElementById('uploadBtn');
const uploadStatus = document.getElementById('uploadStatus');
const uploadProgress = document.getElementById('uploadProgress');
const progressBar = uploadProgress.querySelector('.progress-bar');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('dragover'); fileInput.files = e.dataTransfer.files; });

async function uploadFile() {
  const file = fileInput.files[0];
  if (!file) { uploadStatus.textContent = '请先选择文件'; return; }
  if (file.size > 50 * 1024 * 1024) { uploadStatus.textContent = '文件过大（最大50MB）'; return; }

  const form = new FormData();
  form.append('file', file);
  form.append('doc_type', document.getElementById('docType').value);
  form.append('department', document.getElementById('deptInput').value);
  form.append('source', file.name);

  uploadBtn.disabled = true;
  uploadStatus.textContent = '上传中...';
  uploadProgress.classList.add('active');
  progressBar.style.width = '0%';

  let progress = 0;
  const timer = setInterval(() => { progress = Math.min(progress + 15, 85); progressBar.style.width = progress + '%'; }, 300);

  try {
    const r = await fetch(`${API}/ingest`, { method: 'POST', body: form });
    const d = await r.json();
    clearInterval(timer);
    progressBar.style.width = '100%';
    uploadStatus.textContent = r.ok ? `✅ ${d.message} (${d.chunks} 个片段)` : `❌ ${d.detail || '上传失败'}`;
    if (r.ok) { fileInput.value = ''; refreshDocCount(); }
  } catch (e) {
    clearInterval(timer);
    uploadStatus.textContent = '❌ 网络错误';
  }
  uploadBtn.disabled = false;
  setTimeout(() => uploadProgress.classList.remove('active'), 500);
}

uploadBtn.addEventListener('click', uploadFile);

// ── 对话 ──
const chatArea = document.getElementById('chatArea');
const queryInput = document.getElementById('queryInput');
const sendBtn = document.getElementById('sendBtn');
const welcome = chatArea.querySelector('.welcome');

function addMsg(role, content, sources) {
  if (welcome) welcome.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  let html = content.replace(/\n/g, '<br>');
  if (sources && sources.length) {
    html += '<div class="sources">📎 来源: ' + sources.map(s => '<span>' + s.substring(0,8) + '</span>').join('') + '</div>';
  }
  div.innerHTML = html;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

async function sendQuery() {
  const q = queryInput.value.trim();
  if (!q) return;

  addMsg('user', q);
  queryInput.value = '';
  sendBtn.disabled = true;
  setStatus('思考中...');

  const body = { query: q };
  if (currentConvId) body.conversation_id = currentConvId;
  if (history.length) body.history = history.slice(-6);

  try {
    const r = await fetch(`${API}/chat`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const d = await r.json();
    addMsg('assistant', d.answer, d.sources);
    history.push({ role: 'user', content: q });
    history.push({ role: 'assistant', content: d.answer });
    loadConversations();  // 刷新列表（标题可能更新）
  } catch (e) {
    addMsg('assistant', '❌ 请求失败，请检查服务状态');
  }
  sendBtn.disabled = false;
  setStatus('就绪');
}

sendBtn.addEventListener('click', sendQuery);
queryInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendQuery(); });

// ── 状态 ──
function setStatus(text) { document.getElementById('statusText').textContent = text; }

async function refreshDocCount() {
  try {
    await fetch(`${API}/search`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query: '', top_k: 1 }) });
    document.getElementById('docList').innerHTML = '<div class="empty">文档已就绪 ✓</div>';
  } catch (e) {}
}

// ── 评估 ──
async function genDataset() {
  const s = document.getElementById('evalStatus');
  s.textContent = '生成中...';
  try {
    const r = await fetch(`${API}/eval/generate-dataset?num_per_doc=3`, { method: 'POST' });
    const d = await r.json();
    s.textContent = `✅ ${d.message}`;
  } catch(e) { s.textContent = '❌ 生成失败'; }
}

async function evalRetrieval() {
  const s = document.getElementById('evalStatus');
  s.innerHTML = '评估中...';
  try {
    const r = await fetch(`${API}/eval/retrieval?top_k=5`);
    const d = await r.json();
    if (d.error) { s.innerHTML = `❌ ${d.error}`; return; }
    s.innerHTML = `<b>检索质量</b><br>MRR: ${d.MRR}<br>Precision@${d.top_k}: ${d['Precision@5']}<br>NDCG@${d.top_k}: ${d['NDCG@5']}<br><small>${d.total_queries} queries</small>`;
  } catch(e) { s.innerHTML = '❌ 评估失败'; }
}

async function evalGeneration() {
  const s = document.getElementById('evalStatus');
  s.innerHTML = '评估中（较慢，需调用LLM）...';
  try {
    const r = await fetch(`${API}/eval/generation?top_k=3`);
    const d = await r.json();
    if (d.error) { s.innerHTML = `❌ ${d.error}`; return; }
    s.innerHTML = `<b>生成质量</b><br>Faithfulness: ${d.avg_faithfulness}<br>Answer Relevance: ${d.avg_answer_relevance}<br><small>${d.total} samples</small>`;
  } catch(e) { s.innerHTML = '❌ 评估失败'; }
}

async function evalFull() {
  const s = document.getElementById('evalStatus');
  s.innerHTML = '全量评估中...';
  try {
    const r = await fetch(`${API}/eval/full?top_k_for_retrieval=5&top_k_for_gen=3`, { method: 'POST' });
    const d = await r.json();
    if (d.error) { s.innerHTML = `❌ ${d.error}`; return; }
    s.innerHTML = `<b>🔬 完整评估 (${d.dataset_size}条)</b><br>
      检索: MRR=${d.retrieval.MRR} P@5=${d.retrieval['Precision@5']} NDCG=${d.retrieval['NDCG@5']}<br>
      生成: Faith=${d.generation.avg_faithfulness} Rel=${d.generation.avg_answer_relevance}`;
  } catch(e) { s.innerHTML = '❌ 评估失败'; }
}

async function checkHealth() {
  try {
    const r = await fetch('/health');
    const d = await r.json();
    if (d.status === 'ok') {
      document.getElementById('statusDot').className = 'status-dot ok';
      setStatus('就绪');
    }
  } catch (e) {
    document.getElementById('statusDot').className = 'status-dot';
    setStatus('未连接');
  }
}

checkHealth();
setInterval(checkHealth, 10000);
</script>
</body>
</html>
